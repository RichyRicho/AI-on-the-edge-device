name: Test camera-init fix build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: fix/camera-init-platform-6.5
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio markdown

      - name: Build firmware
        run: cd code && platformio run --environment esp32cam

      - name: Show generated firmware files
        run: find code/.pio/build/esp32cam -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware binaries for short-term testing
        uses: actions/upload-artifact@v4
        with:
          name: camera-init-test-${{ github.sha }}
          path: |
            code/.pio/build/esp32cam/firmware.bin
            code/.pio/build/esp32cam/partitions.bin
            code/.pio/build/esp32cam/bootloader.bin
          retention-days: 30
          if-no-files-found: error
